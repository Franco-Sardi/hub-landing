    <!-- Handoff V3: Montserrat (títulos 800 / landings 600, y fallback de PP Neue Montreal en
         el cuerpo hasta que Branding entregue el webfont licenciado) + Roboto Condensed (labels). -->
    <!-- Primer fondo del hero: es el LCP de la home. Se precarga durante el parseo del HTML,
         antes que el bundle. Solo en "/": en las landings sería peso de más. -->
    <script>
      if (location.pathname === '/') {
        var l = document.createElement('link')
        l.rel = 'preload'; l.as = 'image'; l.fetchPriority = 'high'
        l.href = '/hub-hero.webp'
        document.head.appendChild(l)
      }
    </script>
    <!-- Umami autoalojado. El data-website-id es publico por diseno: viaja en el HTML
         de todos los sitios de la agencia, no es un secreto y no va en un .env. -->
    <script defer src="https://stats.sbflows.com/script.js"
            data-website-id="7e16c460-f2e9-49bd-b26f-dbfb0095e9dd"></script>

  <body>
    <div id="root"></div>
    <!-- Preamble React Fast Refresh — workaround para @vitejs/plugin-react v6.
         En dev el plugin debería inyectarlo automáticamente pero a veces no sucede,
         causando "$RefreshSig$ is not defined". Este script se ignora en prod. -->
    <script type="module">
      import RefreshRuntime from "/@react-refresh"
      RefreshRuntime.injectIntoGlobalHook(window)
      window.$RefreshReg$ = () => {}
      window.$RefreshSig$ = () => (type) => type
      window.__vite_plugin_react_preamble_installed__ = true
    </script>
    <script type="module" src="/src/main.jsx"></script>
